[package]
name = "mars-schema-wasm"
version = "0.20.5"
edition = "2024"
description = "WebAssembly bindings for mars-schema"
license = "MIT"
repository = "https://github.com/haowjy/mars-agents"
homepage = "https://github.com/haowjy/mars-agents"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mars-schema = { version = "0.20.5", path = "../mars-schema" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11.19"
js-sys = "0.3"
