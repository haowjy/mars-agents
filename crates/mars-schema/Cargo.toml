[package]
name = "mars-schema"
version = "0.23.0"
edition = "2024"
description = "Pure schema reader and editor for Mars agent packages"
license = "MIT"
repository = "https://github.com/haowjy/mars-agents"
homepage = "https://github.com/haowjy/mars-agents"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22.27"
yaml-rust2 = { version = "0.13", default-features = false }
