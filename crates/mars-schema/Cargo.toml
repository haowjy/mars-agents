[package]
name = "mars-schema"
version = "0.26.2"
edition = "2024"
description = "Pure schema reader and editor for Mars agent packages"
license = "MIT"
repository = "https://github.com/haowjy/mars-agents"
homepage = "https://github.com/haowjy/mars-agents"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
regex-syntax = { version = "0.8", default-features = false, features = ["unicode"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
toml_edit = { version = "0.22.27", features = ["serde"] }
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
regex = "1"
